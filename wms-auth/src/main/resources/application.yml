server:
  port: 9001
  servlet:
    context-path: /

spring:
  application:
    name: wms-auth
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  cloud:
    nacos:
      server-addr: ${NACOS_ADDR:127.0.0.1:8848}
      discovery:
        namespace: ${NACOS_NAMESPACE:public}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
      config:
        import-check:
          enabled: false
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DB:0}
      timeout: 5s
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Shanghai
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false

wms:
  jwt:
    secret: ${JWT_SECRET:wms-auth-jwt-secret-key-change-me-please-32bytes-min}
    expire-seconds: ${JWT_EXPIRE_SECONDS:28800}
  login:
    max-fail-count: ${LOGIN_MAX_FAIL:5}
    lock-minutes: ${LOGIN_LOCK_MINUTES:30}
  password:
    default-password: ${DEFAULT_PASSWORD:123456}

logging:
  level:
    com.wms: debug
    org.springframework.cloud.openfeign: info
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId}] %logger{36} - %msg%n"

knife4j:
  enable: true
  setting:
    language: zh_cn
