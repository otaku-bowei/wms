server:
  port: 8080

spring:
  application:
    name: wms-gateway
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  cloud:
    nacos:
      server-addr: ${NACOS_ADDR:127.0.0.1:8848}
      discovery:
        namespace: ${NACOS_NAMESPACE:public}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
      config:
        import-check:
          enabled: false
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        # 认证服务
        - id: wms-auth
          uri: lb://wms-auth
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - StripPrefix=0
        # 系统管理服务
        - id: wms-system
          uri: lb://wms-system
          predicates:
            - Path=/api/v1/users/**,/api/v1/roles/**,/api/v1/permissions/**,/api/v1/logs/**,/api/v1/config/**
          filters:
            - StripPrefix=0
        # 基础数据服务
        - id: wms-base
          uri: lb://wms-base
          predicates:
            - Path=/api/v1/skus/**,/api/v1/warehouses/**,/api/v1/zones/**,/api/v1/locations/**,/api/v1/suppliers/**
          filters:
            - StripPrefix=0
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DB:0}

wms:
  jwt:
    secret: ${JWT_SECRET:wms-auth-jwt-secret-key-change-me-please-32bytes-min}
    expire-seconds: ${JWT_EXPIRE_SECONDS:28800}

logging:
  level:
    com.wms: debug
    org.springframework.cloud.gateway: info
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId}] %logger{36} - %msg%n"
